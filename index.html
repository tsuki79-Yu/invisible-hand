<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invisible Hand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Economics and finance for students: live country data, news, concepts with history, Q1 papers, films and research tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap">

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#today" aria-label="Invisible Hand home">
      <span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5"/>
        <g class="brand-rings"><ellipse cx="16" cy="16" rx="11" ry="4.2"/><ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(30 16 16)"/><ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(90 16 16)"/><ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(120 16 16)"/><ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(150 16 16)"/></g>
        <circle class="brand-dot" cx="16" cy="16" r="2.2" fill="currentColor" stroke="none"/>
      </svg></span>
      <b>Invisible <i>Hand</i></b>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-route="today" data-i18n="navToday">Today</a>
      <a href="#learn" data-route="learn" data-i18n="navLearn">Learn</a>
      <a href="#news" data-route="news" data-i18n="navNews">News</a>
      <a href="#films" data-route="films" data-i18n="navFilms">Films</a>
      <a href="#library" data-route="library" data-i18n="navLibrary">Library</a>
    </nav>
    <div class="tools">
      <button class="search-btn" id="openSearch" type="button" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span data-i18n="search">Search</span><kbd>/</kbd>
      </button>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="gz" aria-pressed="false">Gen Z</button>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-today" aria-labelledby="todayTitle"></section>
  <section class="view" id="view-learn" hidden></section>
  <section class="view" id="view-topic" hidden></section>
  <section class="view" id="view-news" hidden></section>
  <section class="view" id="view-films" hidden></section>
  <section class="view" id="view-library" hidden></section>
</main>

<footer>
  <div class="wrap">
    <span>Invisible Hand · Country data: <a href="https://data.worldbank.org/" target="_blank" rel="noopener">World Bank WDI</a> · Headlines link to their original publishers.</span>
    <span><button type="button" class="link-btn" data-yu-feedback>Send us feedback</button> · <span id="footUpdated"></span></span>
  </div>
</footer>

<div class="overlay" id="searchOverlay" hidden>
  <div class="sbox" role="dialog" aria-modal="true" aria-label="Search">
    <label class="sr" for="searchInput">Search concepts, countries, papers, films and news</label>
    <input id="searchInput" type="search" autocomplete="off" placeholder="Search concepts, countries, papers, films, news…">
    <div class="sres" id="searchResults"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/countries.js"></script>
<script src="data/news.js"></script>
<script src="data/spotlight.js"></script>
<script src="data/config.js"></script>

<script src="assets/app.js"></script>
<script src="assets/yu.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" defer></script>
<script src="assets/yu3d.js" defer></script>

</html>
